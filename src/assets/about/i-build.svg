<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>
.o{stroke:#947C62;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fb{transform-box:fill-box}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1) rotate(20deg);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}


.fb2{transform-box:fill-box;transform-origin:50% 100%}
.a{animation:fa 5s cubic-bezier(.5,0,.8,.6) infinite}@keyframes fa{0%,4%{transform:translateY(-70px);opacity:0}7%{opacity:1}14%{transform:translateY(0) scale(1.08,.9)}18%{transform:translateY(0) scale(1)}86%{transform:translateY(0);opacity:1}94%,100%{transform:translateY(-6px);opacity:0}}
.b{animation:fbb 5s cubic-bezier(.5,0,.8,.6) infinite}@keyframes fbb{0%,16%{transform:translateY(-70px);opacity:0}19%{opacity:1}26%{transform:translateY(0) scale(1.08,.9)}30%{transform:translateY(0) scale(1)}86%{transform:translateY(0);opacity:1}94%,100%{transform:translateY(-6px);opacity:0}}
.c{animation:fc 5s cubic-bezier(.5,0,.8,.6) infinite}@keyframes fc{0%,28%{transform:translateY(-70px);opacity:0}31%{opacity:1}38%{transform:translateY(0) scale(1.08,.9)}42%{transform:translateY(0) scale(1)}86%{transform:translateY(0);opacity:1}94%,100%{transform:translateY(-6px);opacity:0}}
.base{transform-box:fill-box;transform-origin:50% 100%;animation:base 5s infinite}
@keyframes base{0%,13%,17%,25%,29%,37%,41%,100%{transform:scale(1)}14%,26%,38%{transform:scale(1.05,.93)}}
.flag{transform-box:fill-box;transform-origin:50% 100%;animation:flag 5s infinite}
@keyframes flag{0%,44%{transform:scaleY(0);opacity:0}50%{transform:scaleY(1.15);opacity:1}54%,86%{transform:scaleY(1);opacity:1}94%,100%{transform:scaleY(0);opacity:0}}
.wave{transform-box:fill-box;transform-origin:0 50%;animation:wave 1s ease-in-out infinite alternate}
@keyframes wave{from{transform:skewY(-6deg) scaleX(.9)}to{transform:skewY(6deg) scaleX(1)}}
.sp{transform-box:fill-box;transform-origin:center;animation:sp 5s ease-out infinite}.sp2{animation-delay:.15s}
@keyframes sp{0%,46%{transform:scale(0);opacity:0}54%{transform:scale(1.15) rotate(45deg);opacity:1}66%{transform:scale(1) rotate(60deg);opacity:1}78%,100%{transform:scale(0);opacity:0}}
</style>
<ellipse cx="100" cy="164" rx="54" ry="6" fill="#947C62" opacity=".22"/>
<g class="fb2 a"><g><rect x="58" y="84" width="46" height="28" rx="8" fill="#FCD0C6" class="o"/><path d="M65 91 h12" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".7"/></g></g>
<g class="fb2 b"><g><rect x="104" y="84" width="38" height="28" rx="8" fill="#F9E39A" class="o"/><path d="M111 91 h12" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".7"/></g></g>
<g class="fb2 c"><g><rect x="74" y="56" width="52" height="28" rx="8" fill="#F5D15A" class="o"/><path d="M81 63 h12" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".7"/></g></g>
<g class="flag"><line x1="100" y1="56" x2="100" y2="26" class="o" style="stroke-width:4"/><path class="wave" d="M102 27 L122 33 L102 40 Z" fill="#C5D48A" style="stroke:#947C62;stroke-width:3.5;stroke-linejoin:round"/></g>
<g class="base">
<rect x="48" y="112" width="104" height="46" rx="12" fill="#FAF8F3" class="o"/>
<ellipse cx="73" cy="139" rx="6" ry="3.5" fill="#FCD0C6" opacity=".95"/><ellipse cx="127" cy="139" rx="6" ry="3.5" fill="#FCD0C6" opacity=".95"/><g class="blink"><ellipse cx="85" cy="131" rx="3.6" ry="4.6" fill="#F58C76"/><ellipse cx="115" cy="131" rx="3.6" ry="4.6" fill="#F58C76"/><circle cx="86.2" cy="129.2" r="1.3" fill="#fff"/><circle cx="116.2" cy="129.2" r="1.3" fill="#fff"/></g><path d="M94 136 q6 6 12 0" fill="none" class="o" style="stroke-width:3.5"/>
</g>
<g transform="translate(70 34)"><g class="sp"><path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10Z" fill="#F5D15A" class="o" style="stroke-width:3"/></g></g>
<g transform="translate(140 46)"><g class="sp sp2"><path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10Z" fill="#F5D15A" class="o" style="stroke-width:3"/></g></g>
</svg>
