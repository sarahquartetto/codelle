<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>
.o{stroke:#947C62;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fb{transform-box:fill-box}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1) rotate(20deg);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.mag{transform-box:view-box;transform-origin:78px 86px;animation:sway 3.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(4px,-4px) rotate(6deg)}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:up 4s cubic-bezier(.3,1.5,.6,1) infinite both}
.b2{animation-delay:.25s}.b3{animation-delay:.5s}
@keyframes up{0%,5%{transform:scaleY(.15)}25%,82%{transform:scaleY(1)}95%,100%{transform:scaleY(.15)}}
.st{transform-box:fill-box;transform-origin:center;animation:st 4s ease-out infinite}
@keyframes st{0%,28%{transform:scale(0) rotate(0);opacity:0}38%{transform:scale(1.25) rotate(40deg);opacity:1}48%,80%{transform:scale(1) rotate(45deg);opacity:1}90%,100%{transform:scale(0);opacity:0}}
.lf{transform-box:fill-box;transform-origin:50% 0;animation:lf 3s ease-in-out infinite}
@keyframes lf{0%,100%{transform:rotate(-12deg) translateY(0)}50%{transform:rotate(12deg) translateY(4px)}}
</style>
<ellipse cx="110" cy="160" rx="66" ry="6" fill="#947C62" opacity=".22"/>
<line x1="100" y1="150" x2="176" y2="150" class="o"/>
<rect class="bar" x="108" y="122" width="16" height="28" rx="5" fill="#F9E39A" style="stroke:#947C62;stroke-width:4;stroke-linejoin:round"/>
<rect class="bar b2" x="130" y="102" width="16" height="48" rx="5" fill="#FCD0C6" style="stroke:#947C62;stroke-width:4;stroke-linejoin:round"/>
<rect class="bar b3" x="152" y="80" width="16" height="70" rx="5" fill="#C5D48A" style="stroke:#947C62;stroke-width:4;stroke-linejoin:round"/>
<g transform="translate(160 64)"><g class="st"><path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10Z" fill="#F5D15A" class="o" style="stroke-width:3"/></g></g>

<g class="mag">
<line x1="55" y1="109" x2="36" y2="128" stroke="#947C62" stroke-width="15" stroke-linecap="round"/>
<line x1="55" y1="109" x2="36" y2="128" stroke="#FCD0C6" stroke-width="6" stroke-linecap="round"/>
<circle cx="78" cy="86" r="33" fill="#F5D15A" class="o"/>
<circle cx="78" cy="86" r="24" fill="#FAF8F3" class="o" style="stroke-width:4"/>
<path d="M62 78 a17 17 0 0 1 10 -11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="64" cy="94" rx="6" ry="3.5" fill="#FCD0C6" opacity=".95"/><ellipse cx="92" cy="94" rx="6" ry="3.5" fill="#FCD0C6" opacity=".95"/><g class="blink"><ellipse cx="70" cy="86" rx="3.6" ry="4.6" fill="#F58C76"/><ellipse cx="86" cy="86" rx="3.6" ry="4.6" fill="#F58C76"/><circle cx="71.2" cy="84.2" r="1.3" fill="#fff"/><circle cx="87.2" cy="84.2" r="1.3" fill="#fff"/></g><path d="M72 91 q6 6 12 0" fill="none" class="o" style="stroke-width:3.5"/>
</g>
</svg>
