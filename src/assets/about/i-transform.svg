<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>
.o{stroke:#947C62;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fb{transform-box:fill-box}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1) rotate(20deg);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.page{transform-box:fill-box;transform-origin:50% 100%;animation:sq 5s ease-in-out infinite}
@keyframes sq{0%,40%,62%,100%{transform:scale(1)}45%{transform:scale(1.1,.88)}52%{transform:scale(.94,1.08)}}
.before{animation:bf 5s infinite}
@keyframes bf{0%,40%{opacity:1}48%,92%{opacity:0}100%{opacity:1}}
.after{animation:af 5s infinite}
@keyframes af{0%,42%{opacity:0}50%,88%{opacity:1}97%,100%{opacity:0}}
.sp{transform-box:fill-box;transform-origin:center;animation:sp 5s ease-out infinite}
.sp2{animation-delay:.12s}.sp3{animation-delay:.24s}.sp4{animation-delay:.36s}
@keyframes sp{0%,42%{transform:scale(0) rotate(0);opacity:0}52%{transform:scale(1.15) rotate(45deg);opacity:1}62%{transform:scale(1) rotate(60deg);opacity:1}75%,100%{transform:scale(0) rotate(90deg);opacity:0}}
.tl .leaffill{animation:lc 5s infinite}
@keyframes lc{0%,40%{fill:#C5D48A}50%,88%{fill:#FCD0C6}98%,100%{fill:#C5D48A}}
.tl{transform-box:fill-box;transform-origin:50% 100%;animation:wob 2.5s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
</style>
